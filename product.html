<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tsa Ma Grootman</title>
  <meta name="description" content="Premium heavyweight tee by Tsa Ma Grootman.">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main class="container" id="pdp-root"></main>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow">Complete the rotation</span><h2>You may also like</h2></div></div>
      <div class="grid" id="related"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('pdp-root');
      const p = getProduct(new URLSearchParams(location.search).get('id'));

      if (!p) {
        root.innerHTML = `<div class="notfound"><h1 style="font-size:2.4rem;text-transform:uppercase">Tee not found</h1>
          <p class="muted" style="margin:16px 0 28px">That product may have sold out or moved.</p>
          <a href="shop.html" class="btn btn-dark">Back to the shop</a></div>`;
        document.getElementById('related').innerHTML = PRODUCTS.slice(0, 4).map(productCard).join('');
        return;
      }

      document.title = `${p.name} — Tsa Ma Grootman`;
      document.querySelector('meta[name="description"]').content = `${p.name}: ${p.short} ${formatZAR(p.price)}, free nationwide delivery.`;

      let color = p.colors[0], size = null, qty = 1, imgIdx = 0;

      root.innerHTML = `
        <div class="crumbs" style="padding-top:28px;color:var(--muted)"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / ${p.name}</div>
        <div class="pdp">
          <div>
            <div class="gallery-main"><img id="main-img" alt=""></div>
            <div class="thumbs" id="thumbs"></div>
          </div>
          <div class="pdp-info">
            <span class="eyebrow">${p.collection === 'music' ? 'Music Collection' : 'Logo Collection'}</span>
            <h1>${p.name}</h1>
            <div class="pdp-price">${formatZAR(p.price)}</div>
            <span class="muted small">VAT included · Free delivery nationwide</span>
            <p class="pdp-desc">${p.description}</p>

            <div class="opt-group">
              <div class="opt-label"><span>Colour: <span id="color-name" style="font-weight:400"></span></span></div>
              <div class="color-opts" id="colors">${p.colors.map((c, i) =>
                `<button type="button" style="--c:${c.hex}" data-color="${i}" aria-label="${c.name}" title="${c.name}"></button>`).join('')}</div>
            </div>

            <div class="opt-group">
              <div class="opt-label"><span>Size</span><a href="contact.html#sizing">Size guide</a></div>
              <div class="size-opts" id="sizes">${SIZES.map((s) => `<button type="button" data-size="${s}">${s}</button>`).join('')}</div>
              <div class="size-error" id="size-error">Please choose a size.</div>
            </div>

            <div class="buy-row">
              <div class="qty-box">
                <button type="button" id="qminus" aria-label="Decrease quantity">−</button>
                <span id="qval">1</span>
                <button type="button" id="qplus" aria-label="Increase quantity">+</button>
              </div>
              <button class="btn btn-dark" id="add">Add to cart <span data-icon="arrow"></span></button>
            </div>

            <ul class="perks">
              <li><i data-icon="crown"></i> Heavyweight 300 GSM cotton, relaxed fit</li>
              <li><i data-icon="truck"></i> Free delivery across South Africa · 3–5 working days</li>
              <li><i data-icon="card"></i> Secure payment · Card, Instant EFT or SnapScan</li>
            </ul>
          </div>
        </div>`;
      root.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = ICONS[el.dataset.icon] || ''; });

      const mainImg = document.getElementById('main-img');
      function paint() {
        const imgs = color.images;
        mainImg.src = IMG(imgs[imgIdx]);
        mainImg.alt = `${p.name} in ${color.name}`;
        document.getElementById('color-name').textContent = color.name;
        document.getElementById('thumbs').innerHTML = imgs.length > 1 ? imgs.map((f, i) =>
          `<button type="button" data-img="${i}" class="${i === imgIdx ? 'is-active' : ''}" aria-label="View image ${i + 1}"><img src="${IMG(f)}" alt=""></button>`).join('') : '';
        document.querySelectorAll('[data-color]').forEach((b) => b.classList.toggle('is-active', p.colors[b.dataset.color] === color));
        document.querySelectorAll('[data-size]').forEach((b) => b.classList.toggle('is-active', b.dataset.size === size));
        document.getElementById('qval').textContent = qty;
      }

      root.addEventListener('click', (e) => {
        const c = e.target.closest('[data-color]'); if (c) { color = p.colors[c.dataset.color]; imgIdx = 0; paint(); }
        const s = e.target.closest('[data-size]'); if (s) { size = s.dataset.size; document.getElementById('size-error').style.display = 'none'; paint(); }
        const t = e.target.closest('[data-img]'); if (t) { imgIdx = +t.dataset.img; paint(); }
      });
      document.getElementById('qminus').onclick = () => { qty = Math.max(1, qty - 1); paint(); };
      document.getElementById('qplus').onclick = () => { qty = Math.min(20, qty + 1); paint(); };
      document.getElementById('add').onclick = () => {
        if (!size) { document.getElementById('size-error').style.display = 'block'; return; }
        Cart.add(p.id, color.name, size, qty);
        toast(`Added ${p.name} (${color.name}, ${size}) <a href="#" data-open-cart>View cart</a>`);
      };
      paint();

      const related = PRODUCTS.filter((x) => x.id !== p.id)
        .sort((a, b) => (b.collection === p.collection) - (a.collection === p.collection)).slice(0, 4);
      document.getElementById('related').innerHTML = related.map(productCard).join('');
    });
  </script>
</body>
</html>
