<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Tsa Ma Grootman</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="checkout">
  <header id="site-header"></header>

  <main class="container" id="checkout-root"></main>

  <footer id="site-footer"></footer>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('checkout-root');
      const PROVINCES = ['Eastern Cape', 'Free State', 'Gauteng', 'KwaZulu-Natal', 'Limpopo', 'Mpumalanga', 'North West', 'Northern Cape', 'Western Cape'];

      function summaryHTML() {
        const items = Cart.items();
        const total = Cart.total();
        return `<aside class="summary">
          <h3>Order summary</h3>
          ${items.map((l) => { const p = getProduct(l.id); return p ? `<div class="sum-line">
            <img src="${lineImage(l)}" alt=""><div><strong style="text-transform:uppercase;font-size:.88rem">${p.name}</strong><br><span class="muted small">${l.color} · ${l.size} · Qty ${l.qty}</span></div>
            <span>${formatZAR(p.price * l.qty)}</span></div>` : ''; }).join('')}
          <div class="row" style="margin-top:12px"><span>Subtotal</span><span>${formatZAR(total)}</span></div>
          <div class="row"><span>Delivery</span><span>Free</span></div>
          <div class="row muted small"><span>Includes VAT (15%)</span><span>${formatZAR(total - total / 1.15)}</span></div>
          <div class="row total"><span>Total</span><span>${formatZAR(total)}</span></div>
        </aside>`;
      }

      function renderForm() {
        if (!Cart.items().length) {
          root.innerHTML = `<div class="success"><h1>Your cart is empty</h1><p class="muted" style="margin:16px 0 28px">Find your next statement piece.</p><a href="shop.html" class="btn btn-dark">Shop the collection</a></div>`;
          return;
        }
        root.innerHTML = `
          <div class="crumbs" style="padding-top:28px;color:var(--muted)"><a href="index.html">Home</a> / Checkout</div>
          <div class="checkout-grid">
            <form id="co-form" novalidate>
              <h1 style="font-size:2.4rem;font-weight:900;text-transform:uppercase;margin-bottom:28px">Checkout</h1>
              <span class="eyebrow">Contact</span>
              <div class="form-grid" style="margin-bottom:36px">
                <div class="field"><label for="f-name">Full name</label><input id="f-name" name="name" required autocomplete="name"></div>
                <div class="field"><label for="f-phone">Cell number</label><input id="f-phone" name="phone" type="tel" required autocomplete="tel" placeholder="e.g. 082 123 4567"></div>
                <div class="field full"><label for="f-email">Email</label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
              </div>
              <span class="eyebrow">Delivery address</span>
              <div class="form-grid" style="margin-bottom:36px">
                <div class="field full"><label for="f-addr">Street address</label><input id="f-addr" name="address" required autocomplete="street-address"></div>
                <div class="field"><label for="f-suburb">Suburb</label><input id="f-suburb" name="suburb" required></div>
                <div class="field"><label for="f-city">City / Town</label><input id="f-city" name="city" required autocomplete="address-level2"></div>
                <div class="field"><label for="f-prov">Province</label><select id="f-prov" name="province" required><option value="">Select…</option>${PROVINCES.map((p) => `<option>${p}</option>`).join('')}</select></div>
                <div class="field"><label for="f-code">Postal code</label><input id="f-code" name="postal" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="postal-code"></div>
              </div>
              <span class="eyebrow">Payment</span>
              <div class="pay-opts" style="margin-bottom:32px">
                <label><input type="radio" name="payment" value="Card" checked><span><strong>Card</strong><small>Visa, Mastercard — secure payment link sent to you</small></span></label>
                <label><input type="radio" name="payment" value="Instant EFT"><span><strong>Instant EFT</strong><small>Pay directly from your bank</small></span></label>
                <label><input type="radio" name="payment" value="SnapScan"><span><strong>SnapScan</strong><small>Scan to pay with your phone</small></span></label>
              </div>
              <button class="btn btn-dark btn-block" type="submit">Place order · ${formatZAR(Cart.total())}</button>
              <p class="muted small" style="margin-top:14px">We'll confirm your order and send your secure payment link via WhatsApp and email.</p>
            </form>
            ${summaryHTML()}
          </div>`;

        document.getElementById('co-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const f = e.target;
          if (!f.checkValidity()) { f.reportValidity(); return; }
          const d = Object.fromEntries(new FormData(f));
          const orderNo = 'TMG-' + Date.now().toString(36).toUpperCase().slice(-6);
          const lines = Cart.items().map((l) => { const p = getProduct(l.id); return `• ${l.qty} × ${p.name} (${l.color}, ${l.size}) — ${formatZAR(p.price * l.qty)}`; }).join('\n');
          const msg = `New order ${orderNo}\n\n${lines}\n\nTotal: ${formatZAR(Cart.total())} (free delivery)\nPayment: ${d.payment}\n\n${d.name}\n${d.phone} · ${d.email}\n${d.address}, ${d.suburb}, ${d.city}, ${d.province}, ${d.postal}`;
          Cart.clear();
          root.innerHTML = `<div class="success">
            <span class="eyebrow">Order ${orderNo}</span>
            <h1>Sharp move, grootman.</h1>
            <hr class="rule center">
            <p>Thanks, ${d.name.split(' ')[0].replace(/</g, '&lt;')}. Send your order to us below and we'll reply with your ${d.payment} payment details. Delivery is free and takes 3–5 working days.</p>
            <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px">
              <a class="btn btn-dark" target="_blank" rel="noopener" href="https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(msg)}">Send via WhatsApp</a>
              <a class="btn btn-outline" href="mailto:${STORE.email}?subject=${encodeURIComponent('Order ' + orderNo)}&body=${encodeURIComponent(msg)}">Send via email</a>
            </div>
          </div>`;
          window.scrollTo({ top: 0 });
        });
      }
      renderForm();
    });
  </script>
</body>
</html>
